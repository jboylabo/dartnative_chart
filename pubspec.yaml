name: chart_kit
description: >-
  Reusable line, vertical bar, pie, and horizontal bar chart painters for
  DartNative apps, built with CustomPaint/CustomPainter — no third-party
  chart package required.
version: 0.2.0
homepage: https://github.com/jboylabo/dartnative_chart
repository: https://github.com/jboylabo/dartnative_chart

environment:
  sdk: ^3.12.0-192.0.dev

# Plain version dep: `dn pub get` resolves the DartNative framework from your
# installed SDK (closed resolution) — no registry setup, works offline.
dependencies:
  dartnative: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
